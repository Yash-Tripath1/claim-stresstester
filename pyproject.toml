[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-stresstester"
version = "0.1.0"
description = "Research Claim Stress-Tester: bounded rival-explanation stress testing with a deterministic simulator (offline MVP)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stresstest = "stresstest.cli:main"

[tool.setuptools]
packages = ["stresstest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
